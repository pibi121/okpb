providers = ["node", "python"]

[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x", "openssl", "openssh", "python312", "python312Packages.pip"]

[phases.install]
cmds = [
  "npm ci --include=dev",
  # Nixpacks Python provider uses /opt/venv; force age-gate deps into image.
  "pip install -r requirements.txt || python -m pip install -r requirements.txt || python3 -m pip install -r requirements.txt || true",
  "pip install -q paramiko || python -m pip install -q paramiko || true",
]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "export PATH=\"/opt/venv/bin:/root/.nix-profile/bin:/nix/var/nix/profiles/default/bin:$HOME/.local/bin:$PATH\"; command -v python3 || command -v python || true; npx tsx scripts/railway-ensure-data.ts && npx prisma db push && node scripts/start-railway.mjs"
