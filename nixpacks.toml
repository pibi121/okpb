[phases.setup]
# Legacy nixpacks file — Railway now builds with Railpack/mise (see mise.toml).
nixPkgs = ["nodejs_22", "npm-10_x", "openssl", "openssh", "python312", "python312Packages.pip"]

[phases.install]
cmds = [
  "npm ci --include=dev",
  "python -m pip install -r requirements-age-gate.txt || python3 -m pip install -r requirements-age-gate.txt || true",
  "python -m pip install -q paramiko || python3 -m pip install -q paramiko || true",
]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "export PATH=\"$MISE_DATA_DIR/shims:/mise/shims:/opt/venv/bin:/root/.nix-profile/bin:$HOME/.local/bin:$PATH\"; command -v python3 || command -v python || true; npx tsx scripts/railway-ensure-data.ts && npx prisma db push && node scripts/start-railway.mjs"