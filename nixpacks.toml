[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x", "openssl", "openssh", "python312", "python312Packages.pip"]

[phases.install]
cmds = [
  "npm ci --include=dev",
  "python3 -m pip install --user paramiko || python -m pip install --user paramiko || true",
]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "npx tsx scripts/railway-ensure-data.ts && npx prisma db push && node scripts/start-railway.mjs"
