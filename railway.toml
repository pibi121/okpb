[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.toml"
buildCommand = "npx prisma generate && npm run build"

[deploy]
# Keep python/pip --user on PATH for age-gate (Node spawn does not always inherit nix bins).
startCommand = "export PATH=\"$HOME/.local/bin:$PATH\"; npx tsx scripts/railway-ensure-data.ts && npx prisma db push && node scripts/start-railway.mjs"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
