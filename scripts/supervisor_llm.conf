[program:ollama]
command=/work/bin/start-ollama.sh
directory=/work
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=20
stdout_logfile=/work/logs/ollama.supervisor.log
stderr_logfile=/work/logs/ollama.supervisor.err.log
environment=CUDA_VISIBLE_DEVICES="0",OLLAMA_KEEP_ALIVE="30m",OLLAMA_HOST="127.0.0.1:11434"

[program:open-webui]
command=/work/bin/start-open-webui.sh
directory=/work
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stdout_logfile=/work/logs/open-webui.supervisor.log
stderr_logfile=/work/logs/open-webui.supervisor.err.log

[program:prompt-composer]
command=/work/bin/start-prompt-composer.sh
directory=/work
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stdout_logfile=/work/logs/prompt-composer.supervisor.log
stderr_logfile=/work/logs/prompt-composer.supervisor.err.log
